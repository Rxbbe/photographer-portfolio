<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privé Galerij</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .prive-login {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      padding: 2rem;
    }
    .prive-login-card {
      background: #fff;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .prive-login-logo {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #0a0a0a;
      margin-bottom: 2rem;
      display: block;
      text-decoration: none;
    }
    .prive-lock-icon { width: 44px; height: 44px; fill: #0a0a0a; margin: 0 auto 1.2rem; display: block; }
    .prive-login-card h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 1.5rem; margin-bottom: 0.4rem; }
    .prive-login-card p { color: #777; font-size: 0.88rem; margin-bottom: 1.5rem; line-height: 1.6; }
    .prive-login-card input[type="password"] {
      width: 100%; border: 1px solid #e5e5e5; padding: 0.85rem 1rem;
      font-size: 1rem; font-family: var(--sans); outline: none;
      margin-bottom: 0.75rem; transition: border-color 0.2s; box-sizing: border-box;
    }
    .prive-login-card input[type="password"]:focus { border-color: #0a0a0a; }
    .prive-login-error { color: #dc2626; font-size: 0.85rem; min-height: 1.3em; margin-bottom: 0.5rem; }
    .prive-login-btn {
      width: 100%; padding: 0.9rem; background: #0a0a0a; color: #fff;
      font-size: 0.8rem; letter-spacing: 0.15em; text-transform: uppercase;
      border: none; cursor: pointer; transition: opacity 0.2s; font-family: var(--sans);
    }
    .prive-login-btn:hover { opacity: 0.85; }
    .prive-login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .prive-back {
      margin-top: 1.5rem; display: inline-block; color: rgba(255,255,255,0.4);
      font-size: 0.8rem; text-decoration: none; transition: color 0.2s;
    }
    .prive-back:hover { color: rgba(255,255,255,0.8); }

    .prive-gallery { display: none; }
    .prive-gallery.visible { display: block; }
    .prive-header { background: #f7f7f7; padding: 6rem 2rem 3rem; text-align: center; }
    .prive-header-eyebrow { font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; color: #777; margin-bottom: 0.8rem; }
    .prive-header h1 { font-family: 'Playfair Display', Georgia, serif; font-size: clamp(2rem, 5vw, 3.5rem); }
    .prive-header p { color: #777; margin-top: 0.6rem; }
    .prive-event-date { display: inline-block; margin-top: 0.8rem; font-size: 0.82rem; color: #888; letter-spacing: 0.06em; }
    .prive-meta-bar {
      display: flex; align-items: center; justify-content: space-between;
      max-width: 1400px; margin: 0 auto; padding: 1.2rem 2rem;
      border-bottom: 1px solid #e8e8e8; font-size: 0.82rem; color: #888;
    }
    .prive-logout-btn {
      display: flex; align-items: center; gap: 0.4rem;
      font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: #777; background: none; border: none; cursor: pointer;
      transition: color 0.2s; font-family: var(--sans);
    }
    .prive-logout-btn:hover { color: #0a0a0a; }
    .prive-logout-btn svg { width: 14px; height: 14px; fill: currentColor; }
    .prive-empty { text-align: center; padding: 6rem 2rem; color: #888; }
    .lb-download {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      background: rgba(255,255,255,0.15); color: white;
      border: 1px solid rgba(255,255,255,0.3); padding: 0.5rem 1rem;
      font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase;
      cursor: pointer; transition: background 0.2s; font-family: var(--sans);
      display: flex; align-items: center; gap: 0.4rem; text-decoration: none;
    }
    .lb-download:hover { background: rgba(255,255,255,0.25); }
    .lb-download svg { width: 14px; height: 14px; fill: currentColor; }
  </style>
</head>
<body>

  <!-- Login -->
  <div class="prive-login" id="prive-login" style="display:none">
    <div class="prive-login-card">
      <a href="/" class="prive-login-logo" id="prive-site-name">Fotograaf</a>
      <svg class="prive-lock-icon" viewBox="0 0 24 24">
        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
      </svg>
      <h1>Privé Galerij</h1>
      <p>Voer de toegangscode in die je van de fotograaf hebt ontvangen.</p>
      <form id="prive-form">
        <p class="prive-login-error" id="prive-error"></p>
        <input type="password" id="prive-password" placeholder="Toegangscode" autocomplete="current-password" required>
        <button type="submit" class="prive-login-btn" id="prive-submit">Toegang</button>
      </form>
    </div>
    <a href="/" class="prive-back">← Terug naar website</a>
  </div>

  <!-- Gallery -->
  <div class="prive-gallery" id="prive-gallery">
    <header class="site-header">
      <div class="header-inner">
        <a href="/" class="site-logo" id="gallery-site-name">Fotograaf</a>
        <nav class="site-nav" id="site-nav"></nav>
        <button class="hamburger" id="hamburger" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <main class="page-content">
      <div class="prive-header">
        <p class="prive-header-eyebrow">Privé Galerij</p>
        <h1 id="gallery-name">Jouw evenement</h1>
        <p id="gallery-desc"></p>
        <span id="gallery-date" class="prive-event-date"></span>
      </div>

      <div class="prive-meta-bar">
        <span id="gallery-count"></span>
        <button class="prive-logout-btn" id="prive-logout">
          <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
          Uitloggen
        </button>
      </div>

      <div class="gallery-grid" id="prive-grid"></div>
    </main>

    <footer class="site-footer">
      <div class="footer-social"></div>
      <p class="footer-copy">&copy; <span id="footer-year"></span></p>
    </footer>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
    <button class="lightbox-close" id="lb-close" aria-label="Sluiten">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
    <span class="lightbox-counter" id="lb-counter"></span>
    <div class="lightbox-img-wrap">
      <img id="lb-img" src="" alt="">
    </div>
    <button class="lightbox-btn lightbox-prev" id="lb-prev" aria-label="Vorige">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </button>
    <button class="lightbox-btn lightbox-next" id="lb-next" aria-label="Volgende">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
    </button>
    <a class="lb-download" id="lb-download" href="#" download target="_blank">
      <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      Downloaden
    </a>
  </div>

  <script>
    const TOKEN_KEY = 'prive_token';
    let photos = [];
    let lbIndex = 0;
    let touchStartX = 0;

    async function boot() {
      const settings = await fetch('/api/settings').then(r => r.json()).catch(() => ({}));
      const siteName = settings.site_name || 'Fotograaf';
      document.title = `Privé Galerij — ${siteName}`;
      document.getElementById('prive-site-name').textContent = siteName;
      document.getElementById('gallery-site-name').textContent = siteName;
      document.getElementById('footer-year').textContent = new Date().getFullYear();

      const token = localStorage.getItem(TOKEN_KEY);
      if (token) {
        const ok = await loadGallery(token);
        if (ok) return;
      }

      document.getElementById('prive-login').style.display = 'flex';
    }

    document.getElementById('prive-form').addEventListener('submit', async e => {
      e.preventDefault();
      const password = document.getElementById('prive-password').value;
      const errorEl = document.getElementById('prive-error');
      const btn = document.getElementById('prive-submit');

      errorEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Laden...';

      try {
        const res = await fetch('/api/private/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        const data = await res.json();
        if (!res.ok) {
          errorEl.textContent = data.error || 'Ongeldige code.';
          btn.disabled = false;
          btn.textContent = 'Toegang';
          return;
        }
        localStorage.setItem(TOKEN_KEY, data.token);
        await loadGallery(data.token);
      } catch {
        errorEl.textContent = 'Er ging iets mis. Probeer opnieuw.';
        btn.disabled = false;
        btn.textContent = 'Toegang';
      }
    });

    async function loadGallery(token) {
      const res = await fetch('/api/private/photos', {
        headers: { Authorization: `Bearer ${token}` },
      });

      if (!res.ok) {
        localStorage.removeItem(TOKEN_KEY);
        return false;
      }

      const data = await res.json();
      photos = data.photos;
      const gallery = data.gallery;

      document.getElementById('gallery-name').textContent = gallery.name;
      document.getElementById('gallery-desc').textContent = gallery.description || '';
      document.title = `${gallery.name} — Privé Galerij`;

      if (gallery.event_date) {
        const d = new Date(gallery.event_date);
        document.getElementById('gallery-date').textContent =
          d.toLocaleDateString('nl-BE', { day: 'numeric', month: 'long', year: 'numeric' });
      }

      const count = photos.length;
      document.getElementById('gallery-count').textContent = `${count} foto${count !== 1 ? "'s" : ''}`;

      const grid = document.getElementById('prive-grid');
      if (!photos.length) {
        grid.innerHTML = '<div class="prive-empty">Er zijn nog geen foto\'s toegevoegd aan jouw galerij.</div>';
      } else {
        renderGrid(grid, photos);
      }

      buildNav();
      document.getElementById('prive-gallery').classList.add('visible');
      document.getElementById('prive-login').style.display = 'none';
      window.scrollTo(0, 0);
      initLightbox();
      return true;
    }

    document.getElementById('prive-logout').addEventListener('click', () => {
      localStorage.removeItem(TOKEN_KEY);
      document.getElementById('prive-gallery').classList.remove('visible');
      document.getElementById('prive-login').style.display = 'flex';
      document.getElementById('prive-password').value = '';
      document.getElementById('prive-error').textContent = '';
      document.getElementById('prive-submit').disabled = false;
      document.getElementById('prive-submit').textContent = 'Toegang';
    });

    async function buildNav() {
      const nav = document.getElementById('site-nav');
      const cats = await fetch('/api/categories').then(r => r.json()).catch(() => []);
      let links = `<a href="/">Home</a><a href="/about.html">Over mij</a>`;
      cats.forEach(c => { links += `<a href="/gallery.html?slug=${c.slug}">${c.name}</a>`; });
      links += `<a href="/contact.html">Contact</a><a href="/prive" class="active">Privé galerij</a>`;
      nav.innerHTML = links;

      document.getElementById('hamburger').addEventListener('click', () => {
        document.getElementById('hamburger').classList.toggle('open');
        nav.classList.toggle('open');
      });

      window.addEventListener('scroll', () => {
        document.querySelector('.site-header')?.classList.toggle('scrolled', window.scrollY > 20);
      });
    }

    function renderGrid(grid, items) {
      const OVERLAY = `<svg viewBox="0 0 24 24" style="width:32px;height:32px;fill:white"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>`;
      let i = 0;
      function nextChunk() {
        const frag = document.createDocumentFragment();
        const end = Math.min(i + 20, items.length);
        for (; i < end; i++) {
          const p = items[i];
          const item = document.createElement('div');
          item.className = 'gallery-item';
          item.dataset.index = i;
          const img = document.createElement('img');
          img.src = p.url; img.alt = ''; img.loading = i < 8 ? 'eager' : 'lazy'; img.decoding = 'async';
          const overlay = document.createElement('div');
          overlay.className = 'gallery-item-overlay';
          overlay.innerHTML = OVERLAY;
          item.append(img, overlay);
          item.addEventListener('click', () => openLightbox(+item.dataset.index));
          frag.appendChild(item);
        }
        grid.appendChild(frag);
        if (i < items.length) requestAnimationFrame(nextChunk);
      }
      requestAnimationFrame(nextChunk);
    }

    function openLightbox(index) {
      lbIndex = index; renderLightbox();
      document.getElementById('lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      document.body.style.overflow = '';
    }
    function moveLightbox(dir) {
      lbIndex = (lbIndex + dir + photos.length) % photos.length;
      renderLightbox();
    }
    function renderLightbox() {
      const p = photos[lbIndex];
      const img = document.getElementById('lb-img');
      img.src = p.url; img.alt = '';
      document.getElementById('lb-counter').textContent = `${lbIndex + 1} / ${photos.length}`;
      document.getElementById('lb-download').href = p.url;
      img.style.animation = 'none'; img.offsetHeight; img.style.animation = '';
    }
    function initLightbox() {
      document.getElementById('lb-close').addEventListener('click', closeLightbox);
      document.getElementById('lb-prev').addEventListener('click', () => moveLightbox(-1));
      document.getElementById('lb-next').addEventListener('click', () => moveLightbox(1));
      document.getElementById('lightbox').addEventListener('click', e => {
        if (e.target === document.getElementById('lightbox')) closeLightbox();
      });
      document.addEventListener('keydown', e => {
        if (!document.getElementById('lightbox').classList.contains('open')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') moveLightbox(-1);
        if (e.key === 'ArrowRight') moveLightbox(1);
      });
      const lb = document.getElementById('lightbox');
      lb.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
      lb.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 50) moveLightbox(dx < 0 ? 1 : -1);
      });
    }

    boot();
  </script>
</body>
</html>
